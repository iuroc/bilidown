# 发布流程：在推送 v* 标签时构建并发布 GitHub Release。
#
# 取代原 goreleaser + Docker 交叉编译方案：
# - 在每个目标平台的官方原生 runner 上构建，不再需要 Docker 容器 / osxcross / mingw 交叉容器
# - systray 在 Linux/macOS 需要 CGO（GTK/appindicator、AppKit），Windows 是纯 Go（Win32 API）
#   Windows 各架构用 CGO_ENABLED=0 构建，无需 MinGW-w64
#
# 构建产物命名与 goreleaser 保持一致：
#   bilidown_Linux_x86_64.tar.gz
#   bilidown_Windows_x86_64.zip / bilidown_Windows_i386.zip / bilidown_Windows_arm64.zip
#   bilidown_Darwin_x86_64.tar.gz / bilidown_Darwin_arm64.tar.gz

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.23"

jobs:
  # 前端只构建一次，产物 server/static 通过 artifact 共享给各平台构建任务
  frontend:
    name: Build frontend (server/static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: client
        run: pnpm build

      - name: Upload server/static
        uses: actions/upload-artifact@v7
        with:
          name: server-static
          path: server/static
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: ""
            cgo: "1"
            ext: ""
            ldflags: "-s -w"
            format: tar.gz
            archive: bilidown_Linux_x86_64.tar.gz
          # Windows
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cc: ""
            cgo: "0"
            ext: .exe
            ldflags: "-s -w -H windowsgui"
            format: zip
            archive: bilidown_Windows_x86_64.zip
          - target: windows-386
            runner: windows-latest
            goos: windows
            goarch: "386"
            cc: ""
            cgo: "0"
            ext: .exe
            ldflags: "-s -w -H windowsgui"
            format: zip
            archive: bilidown_Windows_i386.zip
          - target: windows-arm64
            runner: windows-latest
            goos: windows
            goarch: arm64
            cc: ""
            cgo: "0"
            ext: .exe
            ldflags: "-s -w -H windowsgui"
            format: zip
            archive: bilidown_Windows_arm64.zip
          # macOS（macos-13 为 Intel，用于 darwin/amd64；macos-14 为 Apple Silicon）
          # - target: darwin-amd64
          #   runner: macos-13
          #   goos: darwin
          #   goarch: amd64
          #   cc: ""
          #   cgo: "1"
          #   ext: ""
          #   ldflags: "-s -w"
          #   format: tar.gz
          #   archive: bilidown_Darwin_x86_64.tar.gz
          - target: darwin-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cc: ""
            cgo: "1"
            ext: ""
            ldflags: "-s -w"
            format: tar.gz
            archive: bilidown_Darwin_arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: server-static
          path: server/static

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      # Linux：systray 需要 GTK3 + libayatana-appindicator3 开发头文件
      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc libgtk-3-dev libayatana-appindicator3-dev

      # Windows：systray 为纯 Go（Win32 API），无需 MinGW-w64，直接 CGO_ENABLED=0 交叉编译
      # ffmpeg.exe 被 .gitignore 忽略，不在仓库内，Windows 发行包需在 CI 中下载
      # 从本仓库 v1.0.1 release 下载，与历史发行版一致（不再依赖第三方 BtbN）
      - name: Download ffmpeg.exe (Windows only)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          mkdir -p server/bin
          curl -fsSL -o server/bin/ffmpeg.exe "https://github.com/iuroc/bilidown/releases/download/v1.0.1/ffmpeg.exe"

      - name: Build
        shell: bash
        working-directory: server
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          go mod tidy
          go build -trimpath -ldflags "${{ matrix.ldflags }}" -o "bilidown${{ matrix.ext }}"

      - name: Stage and package (tar.gz)
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp server/bilidown dist/staging/
          cp -r server/static dist/staging/static
          tar -C dist/staging -czf "dist/${{ matrix.archive }}" bilidown static

      - name: Stage and package (zip)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/staging
          Copy-Item server/bilidown.exe dist/staging/bilidown.exe
          Copy-Item -Recurse server/static dist/staging/static
          New-Item -ItemType Directory -Force dist/staging/bin
          if (Test-Path server/bin/ffmpeg.exe) {
            Copy-Item server/bin/ffmpeg.exe dist/staging/bin/
          }
          Push-Location dist/staging
          Compress-Archive -Path bilidown.exe,static,bin -DestinationPath "../${{ matrix.archive }}" -CompressionLevel Optimal
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bilidown-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bilidown-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
